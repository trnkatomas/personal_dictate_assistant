server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy → Whisper ASR (same origin, no CORS)
    location /api/whisper/ {
        proxy_pass         http://whisper:9000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 120s;   # transcription can take a while
        client_max_body_size 64m;  # allow large audio uploads
    }

    # Proxy → Ollama (same origin, no CORS)
    location /api/ollama/ {
        proxy_pass         http://ollama:11434/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 300s;   # streaming generation can be slow
        # Required for SSE / streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets forever
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
