name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create GitHub Releases

jobs:
  # ── macOS (universal binary: arm64 + amd64) ──────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (darwin/universal)
        working-directory: desktop
        run: wails build -platform darwin/universal -clean

      - name: Package .app as zip
        working-directory: desktop
        run: |
          ditto -c -k --keepParent \
            build/bin/dictate-assistant.app \
            dictate-assistant-macos-universal.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: desktop/dictate-assistant-macos-universal.zip

  # ── Windows (amd64, standalone .exe) ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # No -nsis: the runner doesn't have makensis preinstalled, and a plain
      # standalone .exe (WebView2 ships with Windows 10/11) is enough here.
      - name: Build (windows/amd64)
        working-directory: desktop
        run: wails build -platform windows/amd64 -clean

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: desktop/build/bin/dictate-assistant.exe

  # ── Linux (amd64) ────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ubuntu-latest (24.04 "Noble") dropped libwebkit2gtk-4.0-dev entirely —
          # only 4.1 dev headers are packaged now. Requires -tags webkit2_41 below.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (linux/amd64)
        working-directory: desktop
        run: wails build -platform linux/amd64 -tags webkit2_41 -clean

      - name: Package as tar.gz
        working-directory: desktop
        run: |
          tar czf dictate-assistant-linux-amd64.tar.gz \
            -C build/bin dictate-assistant

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: desktop/dictate-assistant-linux-amd64.tar.gz

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
